version: '3.8'

services:
  webserver:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: cloud_storage_web
    ports:
      - "8080:80"
    volumes:
      - ./project:/var/www/html
      - ./uploads:/var/www/uploads
    restart: always
    depends_on:
      - db
    networks:
      - app-network

  db:
    image: mysql:8.0
    container_name: cloud_storage_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass123
      MYSQL_DATABASE: cloud_storage
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_pass123
    volumes:
      - ./mysql-data:/var/lib/mysql
    networks:
      - app-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: cloud_storage_pma
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      - db
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
